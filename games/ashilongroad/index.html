<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AshiLane: ซิ่งทะลุมิติกับอาชิ 3D (Ashi Long Road)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #07070c;
      font-family: 'Kanit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }
    #loader {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #171822 0%, #07070c 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 20px;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ff2255;
      border-right-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .title {
      font-weight: 700;
      font-size: 1.25rem;
      background: linear-gradient(135deg, #ff3366, #c026d3, #6366f1);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.01em;
    }
    .subtext {
      font-size: 0.88rem;
      color: #94a3b8;
    }
    .open-direct-link {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #ff4d6d;
      text-decoration: underline;
      cursor: pointer;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="../common/rotate-helper.js" defer></script>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div class="title">AshiLane: ซิ่งทะลุมิติกับอาชิ 3D</div>
    <div class="subtext">กำลังโหลดเกมจาก https://ashilongrace.onrender.com ...</div>
    <a href="https://ashilongrace.onrender.com" target="_blank" rel="noopener noreferrer" class="open-direct-link">
      เปิดลิงก์ตรงในหน้าต่างใหม่ ↗
    </a>
  </div>

  <iframe
    id="game-frame"
    src="https://ashilongrace.onrender.com/"
    title="AshiLane 3D Racing"
    allow="autoplay; fullscreen; gamepad; clipboard-write; microphone; camera; accelerometer; gyroscope"
    allowfullscreen
  ></iframe>

  <script>
    const frame = document.getElementById('game-frame');
    const loader = document.getElementById('loader');

    function hideLoader() {
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(() => {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }

    frame.addEventListener('load', () => {
      // Allow slight delay for Three.js canvas to initialize inside the iframe
      setTimeout(hideLoader, 600);
    });

    // Safety timeout in case load event takes time
    setTimeout(hideLoader, 5000);
  </script>
</body>
</html>
