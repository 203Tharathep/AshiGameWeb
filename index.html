<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AshiGameWeb — เว็บรวมเกมออนไลน์</title>
  <meta name="description" content="AshiGameWeb ศูนย์รวมเกมเว็บเล่นได้ทันที รวมเกม Five Nights at Ashi 1 & 2, Meme Duel, AkiraJung และ Ashi Blind Box 3D" />
  <link rel="icon" href="./games/akirajung/asset/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- Cinema Dimmer ("Turn Off Lights") -->
  <div id="lightsOffOverlay" class="lights-off-overlay" title="คลิกเพื่อเปิดไฟกลับ"></div>

  <!-- Clean Minimal Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#home" id="brandLogoLink" class="brand">
        <span class="y8-mark">Y8</span>
        <span class="brand-name">AshiGameWeb</span>
      </a>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="search"
          id="searchInput"
          placeholder="ค้นหาเกม..."
          autocomplete="off"
        />
        <kbd class="search-shortcut">/</kbd>
      </div>

      <div class="header-actions">
        <button id="randomGameBtn" class="btn-ghost" title="สุ่มเกมเข้าเล่น">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span class="hide-sm">สุ่มเกม</span>
        </button>

        <button id="themeToggleBtn" class="btn-icon" title="สลับโหมดสว่าง / มืด" aria-label="สลับธีม">
          <span id="themeIconWrap"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- =====================================================
         VIEW 1: CLEAN HOME CATALOG
         ===================================================== -->
    <section id="homeView">
      <div class="filter-bar">
        <nav id="categoryPills" class="category-pills" aria-label="หมวดหมู่เกม"></nav>
        <span id="gamesCountLabel" class="games-count">5 เกม</span>
      </div>

      <div id="gamesGrid" class="games-grid"></div>
    </section>

    <!-- =====================================================
         VIEW 2: CLEAN THEATER GAME PLAYER
         ===================================================== -->
    <section id="playerView" class="hidden">
      <div class="player-nav">
        <button id="backToHomeBtn" class="back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>กลับหน้าหลัก</span>
        </button>

        <div class="player-crumb">
          <span id="crumbCategory">หมวดหมู่</span>
          <span>/</span>
          <strong id="crumbTitle">ชื่อเกม</strong>
        </div>
      </div>

      <!-- Game Viewport -->
      <div id="gameStageWrapper" class="stage-frame aspect-wide">
        <div id="iframeLoader" class="stage-loader">
          <div class="spinner"></div>
          <span>กำลังโหลดเกม...</span>
        </div>

        <iframe
          id="gameIframe"
          title="Game Player"
          allow="autoplay; fullscreen; gamepad; clipboard-write"
          allowfullscreen
        ></iframe>

        <button id="exitFullscreenBtn" class="exit-fs-btn">ออกจากเต็มจอ (ESC)</button>
      </div>

      <!-- Unified Clean Player Bar -->
      <div class="player-bar">
        <div class="player-meta">
          <img id="playerGameIcon" class="player-icon" src="" alt="" />
          <div>
            <h1 id="playerGameTitle" class="player-title">ชื่อเกม</h1>
            <div class="player-sub">
              <span id="playerCategoryText">หมวดหมู่</span>
            </div>
          </div>
        </div>

        <div class="player-actions">
          <button id="likeBtn" class="tool-btn" title="ถูกใจเกมนี้">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
            </svg>
            <span id="likeCountText">0</span>
          </button>

          <button id="playerFavBtn" class="tool-btn" title="บันทึกเป็นรายการโปรด">
            <span id="playerFavIconWrap"></span>
            <span class="hide-sm">โปรด</span>
          </button>

          <button id="mobileAspectBtn" class="tool-btn" title="สลับสัดส่วนจอมือถือ">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
            <span class="hide-sm">จอมือถือ</span>
          </button>

          <button id="lightsToggleBtn" class="tool-btn" title="ปิดไฟรอบหน้าจอ">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18h6"></path>
              <path d="M10 22h4"></path>
              <path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"></path>
            </svg>
            <span class="hide-sm">ปิดไฟ</span>
          </button>

          <button id="reloadGameBtn" class="tool-btn" title="รีโหลดเกมใหม่">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span class="hide-sm">รีโหลด</span>
          </button>

          <a id="openStandaloneBtn" href="#" target="_blank" rel="noopener noreferrer" class="tool-btn" title="เปิดในแท็บใหม่">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>

          <button id="fullscreenBtn" class="btn-primary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            <span>เต็มจอ</span>
          </button>
        </div>
      </div>

      <!-- Clean Info & Related Games Below Player -->
      <div class="player-details-layout">
        <div class="detail-panel">
          <h2 class="panel-heading">เกี่ยวกับเกม</h2>
          <p id="playerDescription" class="detail-desc"></p>

          <h3 class="panel-subheading">วิธีควบคุม</h3>
          <div id="playerControlsList" class="controls-grid"></div>

          <h3 class="panel-subheading">ภาพตัวอย่าง</h3>
          <div id="playerScreenshotsGrid" class="shots-row"></div>
        </div>

        <aside class="detail-panel">
          <h2 class="panel-heading">เกมอื่นในคลัง</h2>
          <div id="relatedGamesList" class="other-games-list"></div>
        </aside>
      </div>
    </section>
  </main>

  <!-- Minimal Lightbox -->
  <div id="lightboxModal" class="lightbox hidden">
    <button id="closeLightboxBtn" class="lightbox-close" aria-label="ปิด">✕</button>
    <img id="lightboxImg" src="" alt="" />
    <p id="lightboxCaption"></p>
  </div>

  <!-- Minimal Toast -->
  <div id="toast" class="toast"></div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span><strong>AshiGameWeb</strong> · เว็บรวมเกมออนไลน์</span>
    </div>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
