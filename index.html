<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AshiGameWeb</title>
  <meta name="description" content="AshiGameWeb รวมเกมเว็บเล่นได้ทันที — Ashi Tunnel (ทางออกที่ 10), Five Nights at Ashi 1–3, Meme Duel, AkiraJung และ Ashi Blind Box 3D" />
  <link rel="icon" href="./games/akirajung/asset/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css?v=9" />
</head>
<body>
  <!-- Cinema Dimmer ("Lights Off") -->
  <div id="lightsOffOverlay" class="lights-off-overlay" title="คลิกเพื่อเปิดไฟกลับ"></div>

  <!-- Minimal Sticky Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#home" id="brandLogoLink" class="brand" aria-label="หน้าหลัก AshiGameWeb">
        <span class="brand-mark" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 4 20 12 6 20 6 4"></polygon>
          </svg>
        </span>
        <span class="brand-name">AshiGame</span>
      </a>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="7.5"></circle>
          <line x1="20" y1="20" x2="16.35" y2="16.35"></line>
        </svg>
        <input
          type="search"
          id="searchInput"
          placeholder="ค้นหาเกม..."
          autocomplete="off"
        />
        <kbd class="search-shortcut">/</kbd>
      </div>

      <div class="header-actions">
        <!-- Minimal Background Music Pill + Volume -->
        <div id="bgmPillWrap" class="bgm-pill">
          <button id="bgmToggleBtn" class="bgm-toggle" title="เปิด / ปิดเพลงพื้นหลัง" aria-label="เปิดหรือปิดเพลงพื้นหลัง">
            <span id="bgmIconWrap" class="bgm-icon-wrap"></span>
            <span id="bgmLabelText" class="bgm-label hide-sm">BGM</span>
          </button>
          <input
            type="range"
            id="bgmVolumeSlider"
            class="bgm-slider hide-sm"
            min="0"
            max="1"
            step="0.02"
            value="0.45"
            title="ปรับระดับเสียงเพลงพื้นหลัง"
            aria-label="ระดับเสียงเพลงพื้นหลัง"
          />
        </div>

        <button id="randomGameBtn" class="icon-btn" title="สุ่มเกมเข้าเล่น" aria-label="สุ่มเกม">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>

        <button id="themeToggleBtn" class="icon-btn" title="สลับโหมดสว่าง / มืด" aria-label="สลับธีม">
          <span id="themeIconWrap"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- =====================================================
         VIEW 1: MINIMAL HOME CATALOG
         ===================================================== -->
    <section id="homeView" class="view-fade">
      <div class="filter-bar">
        <nav id="categoryPills" class="category-pills" aria-label="หมวดหมู่เกม"></nav>
        <span id="gamesCountLabel" class="games-count">7 เกม</span>
      </div>

      <div id="gamesGrid" class="games-grid"></div>
    </section>

    <!-- =====================================================
         VIEW 2: MINIMAL THEATER GAME PLAYER
         ===================================================== -->
    <section id="playerView" class="view-fade hidden">
      <div class="player-nav">
        <button id="backToHomeBtn" class="back-link">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>หน้าหลัก</span>
        </button>

        <div class="player-crumb">
          <span id="crumbCategory">หมวดหมู่</span>
          <span class="crumb-sep">/</span>
          <strong id="crumbTitle">ชื่อเกม</strong>
        </div>
      </div>

      <!-- Pure Rounded Theater Viewport -->
      <div id="gameStageWrapper" class="stage-frame aspect-wide">
        <div id="iframeLoader" class="stage-loader">
          <div class="spinner"></div>
          <span>กำลังโหลดเกม...</span>
        </div>

        <iframe
          id="gameIframe"
          title="Game Player"
          allow="autoplay; fullscreen; gamepad; clipboard-write"
          allowfullscreen
        ></iframe>

        <button id="exitFullscreenBtn" class="exit-fs-btn">ออกจากเต็มจอ (ESC)</button>
      </div>

      <!-- Minimal Action Bar -->
      <div class="player-bar">
        <div class="player-meta">
          <img id="playerGameIcon" class="player-icon" src="" alt="" />
          <div>
            <h1 id="playerGameTitle" class="player-title">ชื่อเกม</h1>
            <p id="playerCategoryText" class="player-sub">หมวดหมู่</p>
          </div>
        </div>

        <div class="player-actions">
          <button id="playerFavBtn" class="tool-btn" title="บันทึกในรายการโปรด">
            <span id="playerFavIconWrap" class="icon-inline"></span>
            <span class="hide-sm">โปรด</span>
          </button>

          <button id="mobileAspectBtn" class="tool-btn" title="สลับสัดส่วนจอมือถือ">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
            <span class="hide-sm">มือถือ</span>
          </button>

          <button id="lightsToggleBtn" class="tool-btn" title="ปิดไฟรอบหน้าจอ">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M9 18h6"></path>
              <path d="M10 22h4"></path>
              <path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"></path>
            </svg>
            <span class="hide-sm">ปิดไฟ</span>
          </button>

          <button id="reloadGameBtn" class="tool-btn" title="รีโหลดเกมใหม่">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span class="hide-sm">รีโหลด</span>
          </button>

          <a id="openStandaloneBtn" href="#" target="_blank" rel="noopener noreferrer" class="tool-btn" title="เปิดเกมเต็มแท็บใหม่" aria-label="เปิดในแท็บใหม่">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>

          <button id="fullscreenBtn" class="btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            <span>เต็มจอ</span>
          </button>
        </div>
      </div>

      <!-- Minimal Info & Other Games -->
      <div class="player-details-layout">
        <div class="detail-section">
          <h2 class="section-label">รายละเอียด</h2>
          <p id="playerDescription" class="detail-desc"></p>

          <h3 class="section-label sub">การควบคุม</h3>
          <div id="playerControlsList" class="controls-grid"></div>

          <h3 class="section-label sub">ภาพตัวอย่าง</h3>
          <div id="playerScreenshotsGrid" class="shots-row"></div>
        </div>

        <aside class="detail-section">
          <h2 class="section-label">เกมอื่นๆ</h2>
          <div id="relatedGamesList" class="other-games-list"></div>
        </aside>
      </div>
    </section>
  </main>

  <!-- Minimal Lightbox -->
  <div id="lightboxModal" class="lightbox hidden">
    <button id="closeLightboxBtn" class="lightbox-close" aria-label="ปิด">✕</button>
    <img id="lightboxImg" src="" alt="" />
    <p id="lightboxCaption"></p>
  </div>

  <!-- Minimal Toast -->
  <div id="toast" class="toast"></div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>AshiGameWeb</span>
    </div>
  </footer>

  <script type="module" src="./src/main.js?v=9"></script>
</body>
</html>
